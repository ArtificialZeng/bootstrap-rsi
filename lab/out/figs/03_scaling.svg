<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1180" height="545" viewBox="0 0 1180 545" style="max-width: 100%; height: auto;" role="img" aria-labelledby="title description">
  <title id="title">方向编辑与 2 倍预算的规模曲线</title>
  <desc id="description">两个系列均相对同尺寸的留出题基线计算准确率变化。</desc>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-variant-numeric: tabular-nums; }
.label-halo { paint-order: stroke; stroke-width: 3; stroke-linejoin: round; }
.fill-background { fill: #ffffff; } .stroke-background { stroke: #ffffff; }
.fill-panel { fill: #f6f8fb; } .stroke-panel { stroke: #f6f8fb; }
.fill-ink { fill: #182635; } .stroke-ink { stroke: #182635; }
.fill-muted { fill: #46586a; } .stroke-muted { stroke: #46586a; }
.fill-rule { fill: #cdd7e2; } .stroke-rule { stroke: #cdd7e2; }
.fill-axis { fill: #65768a; } .stroke-axis { stroke: #65768a; }
.fill-blue { fill: #006ca6; } .stroke-blue { stroke: #006ca6; }
.fill-orange { fill: #a9460b; } .stroke-orange { stroke: #a9460b; }
.fill-green { fill: #007561; } .stroke-green { stroke: #007561; }
.fill-purple { fill: #81428d; } .stroke-purple { stroke: #81428d; }
.fill-gray { fill: #57697c; } .stroke-gray { stroke: #57697c; }
@media (prefers-color-scheme: dark) {
.fill-background { fill: #141922; } .stroke-background { stroke: #141922; }
.fill-panel { fill: #1d2633; } .stroke-panel { stroke: #1d2633; }
.fill-ink { fill: #f2f5fa; } .stroke-ink { stroke: #f2f5fa; }
.fill-muted { fill: #b7c5d5; } .stroke-muted { stroke: #b7c5d5; }
.fill-rule { fill: #435266; } .stroke-rule { stroke: #435266; }
.fill-axis { fill: #91a2b8; } .stroke-axis { stroke: #91a2b8; }
.fill-blue { fill: #62c1f5; } .stroke-blue { stroke: #62c1f5; }
.fill-orange { fill: #ffac69; } .stroke-orange { stroke: #ffac69; }
.fill-green { fill: #68d6b8; } .stroke-green { stroke: #68d6b8; }
.fill-purple { fill: #dc9be7; } .stroke-purple { stroke: #dc9be7; }
.fill-gray { fill: #adbbcc; } .stroke-gray { stroke: #adbbcc; }
}</style>
  <rect x="0" y="0" width="1180" height="545" rx="0" class="fill-background" />
  <text x="36" y="49" class="fill-ink" font-size="30" text-anchor="start" font-weight="650">方向编辑与 2 倍预算的规模曲线</text>
  <text x="36" y="79" class="fill-muted" font-size="15" text-anchor="start" font-weight="400">两个系列均相对同尺寸的留出题基线计算准确率变化。</text>
  <line x1="36" y1="107" x2="58" y2="107" class="stroke-blue" stroke-width="2" />
  <circle cx="47" cy="107" r="4.5" class="fill-blue" />
  <text x="67" y="111" class="fill-ink" font-size="14" text-anchor="start" font-weight="400">方向编辑</text>
  <line x1="177" y1="107" x2="199" y2="107" class="stroke-orange" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="182" y="101" width="12" height="12" class="fill-background stroke-orange" stroke-width="2" />
  <text x="208" y="111" class="fill-ink" font-size="14" text-anchor="start" font-weight="400">2 倍预算（续写）</text>
  <line x1="99" y1="432.0" x2="1118" y2="432.0" class="stroke-axis" stroke-width="1" />
  <text x="92" y="436.0" class="fill-muted" font-size="11" text-anchor="end" font-weight="400">0</text>
  <line x1="99" y1="366.5" x2="1118" y2="366.5" class="stroke-rule" stroke-width="1" />
  <text x="92" y="370.5" class="fill-muted" font-size="11" text-anchor="end" font-weight="400">+0.2</text>
  <line x1="99" y1="301.0" x2="1118" y2="301.0" class="stroke-rule" stroke-width="1" />
  <text x="92" y="305.0" class="fill-muted" font-size="11" text-anchor="end" font-weight="400">+0.4</text>
  <line x1="99" y1="235.49999999999997" x2="1118" y2="235.49999999999997" class="stroke-rule" stroke-width="1" />
  <text x="92" y="239.49999999999997" class="fill-muted" font-size="11" text-anchor="end" font-weight="400">+0.6</text>
  <line x1="99" y1="170.0" x2="1118" y2="170.0" class="stroke-rule" stroke-width="1" />
  <text x="92" y="174.0" class="fill-muted" font-size="11" text-anchor="end" font-weight="400">+0.8</text>
  <text x="99" y="148" class="fill-muted" font-size="13" text-anchor="start" font-weight="400">准确率变化（百分点）</text>
  <line x1="188.1625" y1="170" x2="188.1625" y2="432" class="stroke-rule" stroke-width="1" stroke-dasharray="3 5" />
  <text x="188.1625" y="456" class="fill-ink" font-size="15" text-anchor="middle" font-weight="650">1.7B</text>
  <line x1="481.125" y1="170" x2="481.125" y2="432" class="stroke-rule" stroke-width="1" stroke-dasharray="3 5" />
  <text x="481.125" y="456" class="fill-ink" font-size="15" text-anchor="middle" font-weight="650">4B</text>
  <text x="481.125" y="190" class="fill-muted" font-size="12" text-anchor="middle" font-weight="400">暂无数据</text>
  <line x1="990.625" y1="170" x2="990.625" y2="432" class="stroke-rule" stroke-width="1" stroke-dasharray="3 5" />
  <text x="990.625" y="456" class="fill-ink" font-size="15" text-anchor="middle" font-weight="650">8B</text>
  <text x="990.625" y="190" class="fill-muted" font-size="12" text-anchor="middle" font-weight="400">暂无数据</text>
  <circle cx="188.1625" cy="186.375" r="4.5" class="fill-blue" />
  <text x="176.1625" y="177.375" class="fill-blue stroke-background label-halo" font-size="13" text-anchor="end" font-weight="650">+0.75</text>
  <text x="608.5" y="485" class="fill-ink" font-size="14" text-anchor="middle" font-weight="400">参数规模（B 表示十亿）</text>
  <text x="36" y="524" class="fill-muted" font-size="13" text-anchor="start" font-weight="400">2 倍预算只在基线截断前缀上再续写一次。缺失的点留空，连线在该处中断。</text>
</svg>